# Include inside the existing api.clyde.games HTTPS server block.
# Preserve existing public API proxy routes and TLS configuration.
location = /mcp {
    proxy_pass http://127.0.0.1:9991/mcp;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    # Required by the SDK's default upstream Host/DNS-rebinding validation.
    proxy_set_header Host 127.0.0.1:9991;
    proxy_buffering off;
    proxy_read_timeout 70s;
    client_max_body_size 64k;
}
location ^~ /internal/mcp { return 404; }
