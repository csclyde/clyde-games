server {
    server_name  admin.clyde.games;

    auth_basic "Clyde Games Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    root /var/www/admin.clyde.games;
    index index.html;

    location = /api/packrat/rebuild {
        proxy_pass http://127.0.0.1:9990/packrat/rebuild;
        include /etc/nginx/snippets/packrat-deploy-token.conf;
        proxy_read_timeout 960s;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Admin bundles have stable names; always revalidate after a deployment.
    location ^~ /build/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:json)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.clyde.games/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.clyde.games/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = admin.clyde.games) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name  admin.clyde.games;
    
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
